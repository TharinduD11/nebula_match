<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nebula Match — Flip cards, match pairs, and solve quick fish challenges for bonus time.">
  <title>Play Game — Nebula Match</title>
  
  <!-- Shared Design System & Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body class="game-body">

  <!-- Ambient Space Atmosphere & Decorative Cosmic Backdrop -->
  <div class="space-backdrop" aria-hidden="true">
    <div class="starfield"></div>
    <div class="orbital-ring"></div>
  </div>

  <div class="game-page-container">
    
    <!-- Top Mission Control Navigation -->
    <header class="game-header">
      <div class="game-header-left">
        <a href="index.html" class="brand-badge brand-badge--compact" aria-label="Abort to Mission Control">
          <div class="brand-icon-wrapper">
            <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="6"></circle>
              <path d="M2.5 14.5c3.5 3.5 12.5 2 17-2.5s3-9.5-0.5-9.5c-3.5 0-9 4-13 8.5"></path>
            </svg>
          </div>
          <span>Nebula Match</span>
        </a>
        <div class="mission-tier-pill" id="tierDisplayPill">
          <span>Medium</span>
        </div>
      </div>

      <div class="game-header-right">
        <!-- Audio / Mute Control -->
        <button type="button" class="hud-icon-btn" id="soundToggleBtn" aria-label="Toggle Sound Effects" title="Sound Effects">
          <svg id="soundOnIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>


        <!-- Active Explorer Badge & Sign Out -->
        <div class="header-auth-group" id="headerAuthGroup">
          <div class="user-badge" id="hudUserBadge">
            <span class="user-badge-avatar" id="hudUserAvatar">E</span>
            <span id="hudUsername">Explorer</span>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="gameSignOutBtn" title="Sign out of your account">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- In-Game Action Dock (kept above the game board) -->
    <div class="game-controls-dock" role="toolbar" aria-label="Game controls">
      <button type="button" class="btn-dock btn-dock-pause" id="bottomPauseBtn" aria-label="Pause or resume game" title="Pause Game">
        <span class="btn-dock-icon pause-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
          </svg>
        </span>
        <span class="btn-dock-label" id="pauseBtnLabel">Pause</span>
      </button>
      <button type="button" class="btn-dock btn-dock-restart" id="bottomRestartBtn" aria-label="Restart game" title="Restart Game">
        <span class="btn-dock-icon restart-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
          </svg>
        </span>
        <span class="btn-dock-label">Restart</span>
      </button>
    </div>

    <!-- Main Game Arena -->
    <main class="game-arena">
      
      <!-- Heads-Up Display (HUD) Dashboard -->
      <section class="game-hud" aria-label="Mission Statistics Dashboard">
        
        <!-- Timer Module -->
        <div class="hud-card hud-timer-card" id="hudTimerCard">
          <div class="hud-label">Time</div>
          <div class="hud-timer-wrap">
            <span class="hud-timer-digits" id="timerDigits">45</span>
            <span class="hud-timer-unit">s</span>
          </div>
          <!-- Progress bar -->
          <div class="hud-timer-bar">
            <div class="hud-timer-fill" id="timerFill" style="width: 100%;"></div>
          </div>
        </div>

        <!-- Score & Combo Module -->
        <div class="hud-card hud-score-card">
          <div class="hud-label">Score</div>
          <div class="hud-score-val" id="scoreValue">0</div>
          <div class="hud-streak-badge" id="streakBadge" style="display: none;">
            <span id="streakCount">2×</span> Streak
          </div>
        </div>

        <!-- Targets Matched Module -->
        <div class="hud-card hud-progress-card">
          <div class="hud-label">Pairs Matched</div>
          <div class="hud-pairs-val">
            <span id="pairsMatched">0</span>
            <span class="hud-pairs-divider">/</span>
            <span id="pairsTotal">8</span>
          </div>
          <div class="hud-sub-label" id="flipsCount">Moves: 0</div>
        </div>

        <!-- Bonus Time Button (Fish Game API - 1 Time Only) -->
        <div class="hud-card hud-star-card">
          <button type="button" class="star-trigger-btn" id="starTriggerBtn" title="Count fish to get +15s bonus time (1 time only)">
            <div class="star-glow-effect" aria-hidden="true"></div>
            <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <div class="star-btn-info">
              <span class="star-btn-title">Bonus Time</span>
              <span class="star-btn-sub">+15s (1x only)</span>
            </div>
          </button>
        </div>

      </section>

      <!-- The 3D Memory Card Grid -->
      <section class="board-container" aria-label="Memory Card Grid">
        <div class="memory-grid" id="memoryGrid" role="grid" aria-label="Card Grid">
          <!-- Dynamically injected via JavaScript -->
        </div>
      </section>

    </main>

    <!-- Pause Modal Overlay -->
    <div class="game-modal-overlay" id="pauseModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="game-modal-card">
        <div class="modal-icon-circle">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </div>
        <h2 class="modal-title">Game Paused</h2>
        <p class="modal-desc">The timer is stopped. Resume whenever you're ready.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary btn-block" id="resumeBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Resume Game</span>
          </button>
          <button type="button" class="btn btn-secondary btn-block" id="restartBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <polyline points="3 3 3 8 8 8"></polyline>
            </svg>
            <span>Restart Game</span>
          </button>
          <a href="difficulty.html" class="btn btn-secondary btn-block">Change Difficulty</a>
          <a href="index.html" class="label-link" style="margin-top: 8px;">Back to Home</a>
        </div>
      </div>
    </div>

    <!-- The Fish Game API Challenge Modal Overlay (Bonus Time) -->
    <div class="game-modal-overlay" id="starChallengeModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="game-modal-card game-modal-card--fish">
        
        <!-- Modal Top Bar -->
        <header class="fish-modal-header">
          <div class="fish-header-left">
            <h2 class="fish-modal-title" id="fishModalTitle">The Fish Game</h2>
          </div>
          <div class="fish-header-right">
            <button type="button" class="fish-modal-close" id="closeChallengeBtn" aria-label="Back to game">×</button>
          </div>
        </header>

        <!-- Fish Game Puzzle Picture -->
        <div class="fish-canvas-window">
          <div class="fish-picture-card" id="fishPictureCard">
            <div class="fish-loading" id="fishLoading">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span>Fetching Quest from Fish Game API...</span>
            </div>
            <img id="fishImg" class="fish-img" alt="Fish Game API Puzzle" style="display: none;" />
          </div>
          <div class="fish-status-row" role="status">
            <span class="fish-status-orb" aria-hidden="true"></span>
            <span id="fishQuestStatus">Quest is ready.</span>
          </div>
        </div>

        <!-- Quest Question & Stepper Form -->
        <form id="fishGameForm" class="fish-game-form" novalidate>
          <div class="fish-question-prompt">
            <label for="fishCountInput" class="fish-prompt-label">
              Enter the number of fish in the picture:
            </label>
            <span class="fish-prompt-sub">Count the fish swimming in the canvas above.</span>
          </div>

          <div class="fish-input-row">
            <!-- Stepper Capsule -->
            <div class="fish-stepper-capsule">
              <button type="button" class="stepper-btn stepper-btn--minus" id="fishMinusBtn" aria-label="Decrease fish count">−</button>
              <input 
                type="number" 
                id="fishCountInput" 
                class="fish-number-input" 
                min="0" 
                max="25" 
                step="1" 
                value="0" 
                placeholder="0"
                required 
                autocomplete="off" />
              <button type="button" class="stepper-btn stepper-btn--plus" id="fishPlusBtn" aria-label="Increase fish count">+</button>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="fishSubmitBtn" class="btn btn-submit">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Submit</span>
            </button>
          </div>
        </form>

        <!-- Feedback Alert Container -->
        <div id="fishFeedback" class="fish-feedback" aria-live="polite"></div>

        <!-- Action Controls -->
        <div class="fish-actions-row">
          <button type="button" class="btn btn-secondary btn-sm" id="fishTryAgainBtn" style="display: none;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <polyline points="3 3 3 8 8 8"></polyline>
            </svg>
            <span>Try Another Puzzle</span>
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- Game Logic Script -->
  <script src="js/game.js"></script>
</body>
</html>
