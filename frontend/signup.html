<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nebula Match — Create your player account to track scores and rank on the leaderboard.">
  <title>Sign Up — Nebula Match</title>
  
  <!-- Shared Design System & Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Space Atmosphere & Decorative Cosmic Backdrop -->
  <div class="space-backdrop" aria-hidden="true">
    <div class="starfield"></div>
    <div class="orbital-ring"></div>
  </div>

  <div class="page-container">
    
    <!-- Top Navigation / Brand Bar -->
    <header class="site-header">
      <a href="index.html" class="brand-badge" aria-label="Nebula Match Home">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6"></circle>
            <path d="M2.5 14.5c3.5 3.5 12.5 2 17-2.5s3-9.5-0.5-9.5c-3.5 0-9 4-13 8.5"></path>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle>
          </svg>
        </div>
        <span>Nebula Match</span>
      </a>

      <!-- Center Nav Links -->
      <nav class="header-nav" aria-label="Main navigation">
        <a href="index.html" class="header-nav-link">Home</a>
        <a href="how-to-play.html" class="header-nav-link">How to Play</a>
        <a href="leaderboard.html" class="header-nav-link">Leaderboard</a>
      </nav>

      <!-- Right Action Link -->
      <div class="header-auth-group">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <section class="auth-card auth-card--signup" aria-labelledby="signup-heading">
        
        <!-- Header & Logo Glyph -->
        <header class="auth-header">
          <div class="auth-header-glyph" aria-hidden="true">
            <!-- Rocket / Expedition Emblem -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
              <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
              <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"></circle>
            </svg>
          </div>
          <h1 id="signup-heading" class="auth-title">Create Account</h1>
          <p class="auth-description">Create an account to save your scores and progress.</p>
        </header>

        <!-- Dynamic Feedback Alert Container -->
        <div id="authAlert" class="auth-alert" role="alert" hidden>
          <svg class="auth-alert-icon" id="alertIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          <span id="alertMessage" class="auth-alert-text"></span>
        </div>

        <!-- Registration Form -->
        <form id="signupForm" class="auth-form auth-form--compact" novalidate>
          
          <!-- Explorer Call Sign (Username) -->
          <div class="form-group" id="usernameGroup">
            <div class="form-label-row">
              <label for="username" class="form-label">Username</label>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-input" 
                placeholder="e.g. alex_star" 
                autocomplete="username" 
                autocapitalize="none" 
                spellcheck="false"
                aria-required="true"
                aria-describedby="usernameError">
            </div>
            <span id="usernameError" class="field-error-msg" aria-live="polite"></span>
          </div>

          <!-- Email Field -->
          <div class="form-group" id="emailGroup">
            <div class="form-label-row">
              <label for="email" class="form-label">Email Address</label>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="you@example.com" 
                autocomplete="email" 
                autocapitalize="none" 
                spellcheck="false"
                aria-required="true"
                aria-describedby="emailError">
            </div>
            <span id="emailError" class="field-error-msg" aria-live="polite"></span>
          </div>

          <!-- Password Field with Strength Indicator -->
          <div class="form-group" id="passwordGroup">
            <div class="form-label-row">
              <label for="password" class="form-label">Password</label>
            </div>
            <div class="input-wrapper input-wrapper--has-trailing">
              <svg class="input-icon-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="At least 6 characters" 
                autocomplete="new-password" 
                aria-required="true"
                aria-describedby="passwordError">
              <button 
                type="button" 
                id="togglePassword" 
                class="password-toggle-btn" 
                aria-label="Show password" 
                aria-controls="password" 
                aria-pressed="false"
                title="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            
            <!-- Apple-Style Segmented Password Strength Meter -->
            <div class="password-strength" aria-live="polite">
              <div class="strength-meter">
                <div id="strengthSeg1" class="strength-segment"></div>
                <div id="strengthSeg2" class="strength-segment"></div>
                <div id="strengthSeg3" class="strength-segment"></div>
              </div>
              <div class="strength-meta">
                <span id="strengthHint">Min. 6 characters</span>
                <span id="strengthLevel" class="strength-text"></span>
              </div>
            </div>

            <span id="passwordError" class="field-error-msg" aria-live="polite"></span>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group" id="confirmPasswordGroup">
            <div class="form-label-row">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
            </div>
            <div class="input-wrapper input-wrapper--has-trailing">
              <svg class="input-icon-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                class="form-input" 
                placeholder="Re-enter password" 
                autocomplete="new-password" 
                aria-required="true"
                aria-describedby="confirmPasswordError">
              <button 
                type="button" 
                id="toggleConfirmPassword" 
                class="password-toggle-btn" 
                aria-label="Show confirm password" 
                aria-controls="confirmPassword" 
                aria-pressed="false"
                title="Show confirm password">
                <svg id="eyeConfirmIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeOffConfirmIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span id="confirmPasswordError" class="field-error-msg" aria-live="polite"></span>
          </div>

          <!-- Primary Submit Button with Embedded Spinner -->
          <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text-content">Create Explorer Account</span>
          </button>

        </form>

        <!-- Card Footer & Sign In Navigation -->
        <footer class="auth-footer">
          <p>
            Already have an explorer account? 
            <a href="login.html" class="link-accent">Sign In</a>
          </p>
        </footer>

      </section>
    </main>

    <!-- Bottom Page Footer -->
    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Auxiliary navigation">
        <a href="index.html">Home</a>
        <span>•</span>
        <a href="how-to-play.html">How to Play</a>
        <span>•</span>
        <a href="login.html">Sign In</a>
      </nav>
    </footer>

  </div>

  <!-- Page Scripts -->
  <script src="js/signup.js"></script>
</body>
</html>
